<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --nav-1: #1a2fd6; --nav-2: #0a0f5c;
    --primary: #3478f6; --primary-dark: #1f5fd6; --primary-soft: #eaf2fe; --primary-line: #c9dcfb;
    --bg: #f6f8fb; --card: #fff; --line: #e4e8ef; --line-strong: #d3d9e3;
    --ink: #111a2e; --ink-2: #4b5567; --ink-3: #8a93a3;
    --ok: #12805c; --ok-soft: #e6f6ef; --warn: #b54708; --warn-soft: #fff4e5; --bad: #c2283a; --bad-soft: #fdecee;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 Poppins, system-ui, -apple-system, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }

  .app { display: flex; min-height: 100vh; }
  /* Left nav */
  .nav { width: 232px; flex: none; background: linear-gradient(180deg, var(--nav-1), var(--nav-2)); color: #fff;
         padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; padding: 0 10px 22px; letter-spacing: -.2px; }
  .brand svg { width: 26px; height: 26px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: rgba(255,255,255,.88);
           text-decoration: none; font-weight: 500; }
  .nav a:hover { background: rgba(255,255,255,.08); }
  .nav a { white-space: nowrap; }
  .nav a.active { background: rgba(255,255,255,.16); color: #fff; }
  .nav a svg { width: 19px; height: 19px; flex: none; }
  .nav .spacer { flex: 1; }
  .nav .who { font-size: 12px; color: rgba(255,255,255,.7); padding: 10px 12px 0; word-break: break-all; }

  .main { flex: 1; min-width: 0; }
  .topbar { height: 56px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 24px; gap: 12px; }
  .topbar .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.bad { background: var(--bad); }
  .page { padding: 26px 24px 80px; max-width: 1240px; }
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -.5px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 10px; }
  .saving { font-size: 13px; color: var(--ink-3); }

  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer;
         border: 1px solid var(--primary); background: #fff; color: var(--primary); white-space: nowrap; }
  .btn:hover { background: var(--primary-soft); }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn.ghost { border-color: transparent; color: var(--ink-2); background: transparent; }
  .btn.ghost:hover { background: #eef1f6; }
  .btn.danger { border-color: var(--line-strong); color: var(--bad); }
  .btn.danger:hover { background: var(--bad-soft); }
  .btn.sm { padding: 5px 11px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg { width: 17px; height: 17px; }
  .icon-btn { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; padding: 6px; border-radius: 6px; display: inline-flex; }
  .icon-btn:hover { background: rgba(0,0,0,.05); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }

  /* Composer */
  .compose { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 30px; align-items: start; }
  .mail { overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 9px 16px; min-height: 46px; }
  .row + .row { padding-top: 0; }
  .row label { width: 62px; flex: none; color: var(--ink-2); }
  .row > div { min-width: 0; overflow-wrap: anywhere; }
  .row input { flex: 1; border: 0; outline: 0; padding: 4px 0; background: transparent; min-width: 0; }
  .row input::placeholder, textarea::placeholder { color: var(--ink-3); }
  .chip-btn { border: 1px solid var(--primary-line); color: var(--primary); background: #fff; border-radius: 6px; padding: 3px 10px;
              font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip-btn:hover { background: var(--primary-soft); }
  .recips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 1; }
  .rchip { background: #eef1f6; border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .rchip.more { background: transparent; color: var(--ink-3); }
  .toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
  .tool { border: 0; background: transparent; padding: 6px 9px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 13px; font-weight: 500;
          display: inline-flex; align-items: center; gap: 6px; }
  .tool:hover { background: #eef1f6; color: var(--ink); }
  .tool svg { width: 16px; height: 16px; }
  .body { width: 100%; border: 0; outline: 0; resize: none; padding: 16px; min-height: 260px; line-height: 1.6; display: block; background: transparent; }
  .body.fu { min-height: 150px; }

  .connector { width: 1px; height: 30px; background: var(--line-strong); margin: 0 auto; }
  .add-fu { display: flex; justify-content: center; }
  .fu-card { overflow: hidden; }
  .fu-head { background: var(--primary-soft); padding: 9px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--primary); }
  .fu-head select, .fu-head input { border: 1px solid var(--line-strong); background: #fff; border-radius: 6px; padding: 4px 8px; color: var(--ink); }
  .fu-head input[type=number] { width: 58px; text-align: center; }
  .fu-head .grow { flex: 1; }
  .fu-head .num { font-weight: 600; color: var(--ink); margin-right: 2px; }

  .side { position: sticky; top: 16px; }
  .side h3 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .side section + section { margin-top: 26px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: #fff; outline: 0; }
  .field input:focus, .field select:focus, .field textarea:focus, .rec-area:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52,120,246,.15); }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .seq-step { padding: 10px 12px; }
  .seq-step + .seq-line { width: 1px; height: 14px; background: var(--line-strong); margin-left: 22px; }
  .seq-step b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seq-step span { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 4px; align-items: center; margin-right: 10px; }
  .seq-step svg { width: 13px; height: 13px; }
  .load-seq { display: flex; gap: 8px; }
  .load-seq select { flex: 1; min-width: 0; border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 8px; background: #fff; }

  /* Lists */
  .banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--radius); margin-bottom: 18px; }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner .btn { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td .sub { color: var(--ink-3); font-size: 13px; }
  td.right { text-align: right; white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--primary-soft); color: var(--primary); }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-2); }
  .empty h2 { color: var(--ink); font-size: 18px; margin: 0 0 6px; }
  .empty p { margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .seq-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .seq-card h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .seq-card .meta { color: var(--ink-2); font-size: 13px; }
  .seq-card .preview { color: var(--ink-3); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 39px; }
  .seq-card .btns { display: flex; gap: 8px; margin-top: auto; }

  .settings { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  .settings .card { padding: 20px; }
  .settings h3 { margin: 0 0 14px; font-size: 16px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .kv:last-of-type { border-bottom: 0; }
  .kv span:first-child { color: var(--ink-2); }
  .kv span:last-child { text-align: right; word-break: break-all; }

  /* Threads */
  .search { display: flex; gap: 8px; margin-bottom: 16px; }
  .search input { flex: 1; min-width: 0; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; background: #fff; outline: 0; }
  .tlist .titem { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .tlist .titem:last-child { border-bottom: 0; }
  .tlist .titem:hover { background: #fafbfd; }
  .titem .main-col { flex: 1; min-width: 0; }
  .titem .subj { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titem .sub { color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titem .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.gray { background: #eef1f6; color: var(--ink-2); }
  .thread-card { padding: 16px; }
  .thread-card .subj { font-size: 17px; font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
  .thread-card .meta { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
  .thread-card .snip { margin-top: 10px; color: var(--ink-2); font-size: 13px; background: #f6f8fb; border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
  .queue { margin-top: 16px; }
  .queue h3 { font-size: 15px; margin: 0 0 8px; }
  .qitem { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .qitem:last-child { border-bottom: 0; }
  .qitem .main-col { flex: 1; min-width: 0; }
  .qitem .when { font-weight: 500; font-size: 13px; }
  .qitem .msg { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
  .cc-rows { border-top: 1px solid var(--line); }
  .cc-rows .row { min-height: 40px; }
  .fu-head input[type=datetime-local] { width: auto; }

  /* Modal + toast */
  .scrim { position: fixed; inset: 0; background: rgba(10,15,40,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal header { padding: 18px 20px 6px; font-size: 18px; font-weight: 600; }
  .modal .content { padding: 8px 20px 4px; color: var(--ink-2); }
  .modal footer { padding: 16px 20px 18px; display: flex; justify-content: flex-end; gap: 10px; }
  .preview-mail { border: 1px solid var(--line); border-radius: 8px; padding: 14px; color: var(--ink); white-space: pre-wrap; margin-top: 8px; }
  .preview-mail .ph { color: var(--ink-3); font-size: 13px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; white-space: normal; }
  .rec-area { width: 100%; min-height: 170px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px; outline: 0; resize: vertical; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #111a2e; color: #fff; padding: 11px 18px; border-radius: 10px;
           box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 60; max-width: calc(100% - 32px); font-size: 14px; }
  .menu { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 4px; z-index: 40; min-width: 200px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: #eef1f6; }
  .menu small { color: var(--ink-3); display: block; }
  .loading { display: flex; align-items: center; justify-content: center; height: 60vh; color: var(--ink-3); gap: 10px; }
  .spin { width: 20px; height: 20px; border: 2px solid var(--primary-line); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 960px) {
    .compose, .settings { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; }
  }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .nav { width: auto; height: auto; position: static; flex-direction: row; align-items: center; padding: 10px 12px; gap: 2px; overflow-x: auto; }
    .brand { padding: 0 8px 0 4px; font-size: 16px; }
    .brand span, .nav .who, .nav .spacer { display: none; }
    .nav a { padding: 8px 10px; font-size: 13px; }
    .nav a svg { display: none; }
    .topbar { display: none; }
    .page { padding: 18px 16px 70px; }
    h1 { font-size: 24px; }
    .page-head .actions { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .page-head .actions .btn { flex: 1 1 auto; justify-content: center; padding: 9px 12px; }
    .row label { width: 52px; }
    th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { display: none; }
    td, th { padding: 12px 10px; }
    .titem { padding: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      <span>Follow-up Studio</span>
    </div>
    <a href="#campaigns" data-nav="campaigns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>Campaigns</a>
    <a href="#new" data-nav="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>New campaign</a>
    <a href="#threads" data-nav="threads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v6"/></svg>Sent emails</a>
    <a href="#sequences" data-nav="sequences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M6.5 10v4a3 3 0 0 0 3 3H14"/></svg>Sequences</a>
    <a href="#settings" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
  </nav>
  <div class="main">
    <div class="topbar"><div class="status" id="status"></div></div>
    <div class="page" id="page"><div class="loading"><div class="spin"></div>Loading your workspace…</div></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ───── Server bridge ─────
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || String(e)));
      });
      r[fn].apply(r, args);
    });
  }

  // ───── State ─────
  var B = null;                 // bootstrap payload
  var draft = null;             // composer state (campaign or sequence)
  var DRAFT_KEY = 'fus.campaignDraft';
  var I = {
    bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>',
    braces: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

  var toastTimer = null;
  function toast(msg, ms) {
    var t = $('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, ms || 3800);
  }

  function modal(opts) {
    // opts: { title, html, actions: [{label, cls, onClick -> bool|Promise}] }
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><header>' + esc(opts.title) + '</header>' +
      '<div class="content">' + opts.html + '</div><footer></footer></div>';
    var footer = $('footer', scrim);
    function close() { if (scrim.parentNode) scrim.parentNode.removeChild(scrim); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    (opts.actions || [{ label: 'Close', cls: 'ghost' }]).forEach(function (a) {
      var b = document.createElement('button');
      b.className = 'btn ' + (a.cls || '');
      b.textContent = a.label;
      b.addEventListener('click', function () {
        if (!a.onClick) return close();
        var r = a.onClick(scrim, b);
        if (r && typeof r.then === 'function') {
          $all('button', footer).forEach(function (x) { x.disabled = true; });
          r.then(function (keep) { if (!keep) close(); else $all('button', footer).forEach(function (x) { x.disabled = false; }); })
           .catch(function (err) { $all('button', footer).forEach(function (x) { x.disabled = false; }); toast(err.message, 6000); });
        } else if (!r) close();
      });
      footer.appendChild(b);
    });
    scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(scrim);
    var f = $('input, textarea', scrim); if (f) f.focus();
    return { el: scrim, close: close };
  }

  // ───── Recipients (mirrors parseRecipientInput_ on the server) ─────
  function parseRecipients(text) {
    var re = /(?:"([^"]*)"|([^<>,;\n"]*?))\s*<\s*([^<>\s,;]+@[^<>\s,;]+)\s*>|([^\s<>,;"]+@[^\s<>,;"]+)/g;
    var out = [], seen = {}, m, s = String(text || '');
    while ((m = re.exec(s)) !== null) {
      var email = (m[3] || m[4] || '').trim(), name = (m[1] || m[2] || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) continue;
      var k = email.toLowerCase();
      if (seen[k]) continue;
      seen[k] = true; out.push({ name: name, email: email });
    }
    return out;
  }
  function firstNameOf(name) {
    var n = String(name || '');
    if (n.indexOf(',') !== -1) n = n.slice(n.indexOf(',') + 1); // "Doe, Jane"
    var first = n.replace(/[",]/g, ' ').trim().split(/\s+/)[0] || '';
    return first.indexOf('@') === -1 ? first : '';
  }
  function render(tmpl, r) {
    return String(tmpl || '')
      .replace(/\{firstName\}/g, firstNameOf(r && r.name) || 'there')
      .replace(/\{senderFirstName\}/g, B.me.firstName || '');
  }
  function withSignature(body) {
    var sig = B.signature || '';
    var t = String(body || '').replace(/\s+$/, '');
    if (!sig) return t;
    if (t.slice(-sig.length) === sig) return t;
    return (t ? t + '\n\n' : '') + sig;
  }

  // ───── Composer model ─────
  function newStep(prev) {
    return { amount: prev ? 4 : 3, unit: 'days', atTime: '', condition: 'no_reply', message: '' };
  }
  function blankDraft(mode) {
    return { mode: mode, name: '', originalName: '', recipients: '', subject: '', body: '', followUps: [],
             campaignName: '', cc: '', bcc: '', tz: B.tz };
  }
  // Quick cadences (default bump message), as relative waits.
  var PRESETS = [['3-7-14', [3, 4, 7]], ['1-3-7', [1, 2, 4]], ['2-5-10', [2, 3, 5]]];
  function presetSteps(waits) {
    return waits.map(function (n) { return { amount: n, unit: 'days', atTime: '', condition: 'no_reply', message: '' }; });
  }
  // What the server expects: exact-date steps carry sendAtAbs (picked wall
  // clock as UTC ms); everything else waits relative to the previous email.
  function stepsPayload(list) {
    return list.map(function (s) {
      var o = { amount: s.amount, unit: s.unit, atTime: s.atTime || '', condition: s.condition, message: s.message || '',
                cc: s.cc || '', bcc: s.bcc || '', sendAtAbs: 0 };
      if (s.unit === 'date') { o.unit = 'days'; o.amount = 1; o.atTime = ''; o.sendAtAbs = s.sendAtLocal ? Date.parse(s.sendAtLocal + ':00Z') : 0; }
      return o;
    });
  }
  function stepProblem(list) {
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (s.unit === 'date') { if (!s.sendAtLocal) return 'Follow-up ' + (i + 1) + ': pick a date and time.'; }
      else if (!(s.amount > 0)) return 'Follow-up ' + (i + 1) + ': the wait must be more than 0.';
    }
    return '';
  }
  function tomorrowNine() {
    var d = new Date(Date.now() + 86400000);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T09:00';
  }
  function persistDraft() { if (draft && draft.mode === 'campaign') store(DRAFT_KEY, draft); }

  function waitLabel(s) {
    if (s.unit === 'date') return s.sendAtLocal ? 'on ' + s.sendAtLocal.replace('T', ' at ') : 'pick a date';
    var u = s.amount === 1 ? s.unit.replace(/s$/, '') : s.unit;
    return s.amount + ' ' + u + (s.atTime ? ' · ' + timeLabel(s.atTime) : '');
  }
  function timeLabel(v) {
    for (var i = 0; i < B.atTimes.length; i++) if (B.atTimes[i].value === v) return B.atTimes[i].label;
    return v;
  }
  function condLabel(v) { return v === 'replied' ? 'If replied' : v === 'always' ? 'Always' : 'If no reply'; }
  function describe(steps) {
    var n = steps.length;
    if (!n) return 'No follow-ups';
    var head = n + (n === 1 ? ' follow-up' : ' follow-ups');
    var allDays = steps.every(function (s) { return s.unit === 'days'; });
    if (allDays) { var d = 0; return head + ' · day ' + steps.map(function (s) { d += s.amount; return d; }).join(', '); }
    return head + ' · ' + steps.map(function (s) { return s.unit === 'date' ? 'date' : s.amount + s.unit.charAt(0); }).join(' → ');
  }

  // ───── Router ─────
  // In-page routing. Apps Script's sandboxed iframe doesn't reliably support
  // hash navigation, so the current page lives in a variable.
  var current = 'campaigns';
  function go(h) { current = String(h || '').replace(/^#/, '') || 'campaigns'; window.scrollTo(0, 0); route(); }
  function route() {
    var h = current;
    var parts = h.split('/');
    var page = parts[0];
    $all('[data-nav]').forEach(function (a) {
      var nav = a.getAttribute('data-nav');
      var on = nav === page || (page === 'sequence' && nav === 'sequences') || (page === 'thread' && nav === 'threads');
      a.classList.toggle('active', on);
    });
    closeMenus();
    if (page === 'new') return pageCompose('campaign');
    if (page === 'sequences') return pageSequences();
    if (page === 'sequence') return pageCompose('sequence', decodeURIComponent(parts.slice(1).join('/')));
    if (page === 'settings') return pageSettings();
    if (page === 'threads') return pageThreads();
    if (page === 'thread') return pageThread(parts.slice(1).join('/'));
    return pageCampaigns();
  }

      : '<span class="dot bad"></span><b style="color:var(--bad)">Scheduler not running — follow-ups won\'t send</b>';

        (h.installError ? ' — ' + esc(h.installError) : '') + '.</div><button class="btn primary sm" data-act="fix">Fix it</button></div>';

  // ───── Composer (campaign or sequence) ─────

        draft.body = seq.firstMessage; draft.followUps = JSON.parse(JSON.stringify(seq.steps));

  function select(key, i, opts, cur) {

  function summaryHtml() {

        '<span>' + I.bolt + esc(condLabel(s.condition)) + '</span><span>' + I.clock + esc(waitLabel(s)) + '</span></div>';

  function autosize(t) { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight, t.classList.contains('fu') ? 150 : 260) + 'px'; }
  function autosizeAll() { $all('textarea.body').forEach(autosize); }

  // ───── Composer actions ─────
  function applySequence(seq) {
    var d = draft, added = seq.steps.length;
    d.followUps = JSON.parse(JSON.stringify(seq.steps));
    if (d.mode === 'campaign') {
      if (!d.subject && seq.subject) d.subject = seq.subject;
      if (!d.body.trim() && seq.firstMessage) d.body = seq.firstMessage;
    }
    persistDraft();
    drawCompose();
    toast('Added ' + added + ' follow-up' + (added === 1 ? '' : 's') + ' from “' + seq.name + '”.');
  }

  function editRecipients() {
    var m = modal({
      title: 'Recipients',
      html: '<p style="margin-top:0">Paste email addresses — one per line, or separated by commas. ' +
        '<code>Name &lt;email&gt;</code> fills <code>{firstName}</code>. Each person gets their own email and thread.</p>' +
        '<textarea class="rec-area" id="recIn" placeholder="Jane Doe <jane@acme.com>\nsam@globex.com">' + esc(draft.recipients) + '</textarea>' +
        '<div class="hint" id="recCount"></div>',
      actions: [
        { label: 'Cancel', cls: 'ghost' },
        { label: 'Done', cls: 'primary', onClick: function (el) {
          draft.recipients = $('#recIn', el).value; persistDraft(); drawCompose(); return false;
        } }
      ]
    });
    var ta = $('#recIn', m.el), cnt = $('#recCount', m.el);
    function upd() {
      var n = parseRecipients(ta.value).length;
      cnt.textContent = n + ' recipient' + (n === 1 ? '' : 's') + (n > B.maxRecipients ? ' — max ' + B.maxRecipients + ' per send' : '');
      cnt.style.color = n > B.maxRecipients ? 'var(--bad)' : '';
    }
    ta.addEventListener('input', upd); upd();

  function previewHtml() {
    var d = draft;
    if (d.mode === 'thread') {
      var tr = parseRecipients(d.recipients || d.thread.recipient)[0] || { name: '', email: d.thread.recipient };
      var subj = /^re:/i.test(d.thread.subject) ? d.thread.subject : 'Re: ' + d.thread.subject;
      if (!d.followUps.length) return '<p style="margin-top:0">Add a follow-up first.</p>';
      return '<p style="margin-top:0">As <b>' + esc(tr.name || tr.email) + '</b> will see it.</p>' + d.followUps.map(function (s, i) {
        return '<div class="preview-mail"><div class="ph">Follow-up ' + (i + 1) + ' · ' + esc(condLabel(s.condition)) + ' · ' + esc(waitLabel(s)) +
          ' · ' + esc(subj) + '</div>' + esc(withSignature(render(s.message || B.defaultTemplate, tr))) + '</div>';
      }).join('');
    }
    var r = parseRecipients(d.recipients)[0] || { name: 'Jane Doe', email: 'jane@example.com' };
    var html = '<p style="margin-top:0">As <b>' + esc(r.name || r.email) + '</b> will see it' +
      (parseRecipients(d.recipients).length ? '' : ' (sample recipient)') + '.</p>' +
      '<div class="preview-mail"><div class="ph"><b>' + esc(render(d.subject, r) || '(no subject)') + '</b><br>To: ' + esc(r.email) + '</div>' +
      esc(withSignature(render(d.body, r))) + '</div>';
    d.followUps.forEach(function (s, i) {
      html += '<div class="preview-mail"><div class="ph">Follow-up ' + (i + 1) + ' · ' + esc(condLabel(s.condition)) + ' · after ' + esc(waitLabel(s)) +
        ' · Re: ' + esc(render(d.subject, r)) + '</div>' + esc(withSignature(render(s.message || B.defaultTemplate, r))) + '</div>';
    });
    return html;
  }

  function validateCampaign() {
    var d = draft, n = parseRecipients(d.recipients).length;
    if (!n) return 'Add at least one recipient.';
    if (n > B.maxRecipients) return 'Up to ' + B.maxRecipients + ' recipients per send.';
    if (!d.subject.trim()) return 'Add a subject.';
    if (!d.body.trim()) return 'Write your first email.';
    return stepProblem(d.followUps);
  }

  function confirmSend() {
    var problem = validateCampaign();
    if (problem) return toast(problem);
    var d = draft, n = parseRecipients(d.recipients).length;
    modal({
      title: 'Send ' + n + ' email' + (n === 1 ? '' : 's') + ' now?',
      html: '<p style="margin-top:0">From <b>' + esc(B.me.email) + '</b>. Each recipient gets their own thread.</p>' +
        (d.followUps.length
          ? '<p>Then up to <b>' + d.followUps.length + ' follow-up' + (d.followUps.length === 1 ? '' : 's') + '</b> as replies on each thread (' +
            esc(describe(d.followUps).replace(/^\d+ follow-ups? · /, '')) + '), stopping when they reply.</p>'
          : '<p>No follow-ups are set — just this email.</p>') +
        (B.health.running ? '' : '<p style="color:var(--bad)"><b>The scheduler isn\'t running</b>, so follow-ups won\'t go out until you fix it in Settings.</p>'),
      actions: [
        { label: 'Cancel', cls: 'ghost' },
        { label: 'Send now', cls: 'primary', onClick: function (el, btn) {
          btn.textContent = 'Sending…';
          return call('studioSendCampaign', {
            recipients: d.recipients, subject: d.subject, body: d.body, followUps: stepsPayload(d.followUps),
            campaignName: d.campaignName, cc: d.cc, bcc: d.bcc, tz: d.tz
          }).then(function (res) {
            B.campaigns = res.campaigns;
            if (res.notArmed && res.notArmed.length) {
              toast('Sent, but follow-ups could not be scheduled for ' + res.notArmed.map(function (x) { return x.email; }).join(', ') +
                ' — open the thread in Gmail and click Start in the sidebar. (' + res.notArmed[0].armError + ')', 12000);
            }
            if (res.failed.length) {
              // Keep the failures in the draft so they can be fixed and resent.
              draft.recipients = res.failed.map(function (f) { return f.email; }).join('\n');
              persistDraft();
              toast('Sent ' + res.sent + '. ' + res.failed.length + ' failed: ' + res.failed[0].email + ' — ' + res.failed[0].error, 9000);
              drawCompose();
            } else {
              draft = blankDraft('campaign'); store(DRAFT_KEY, null);
              if (!(res.notArmed && res.notArmed.length)) toast((res.dryRun ? 'Dry run: would have sent ' : 'Sent ') + res.sent + ' email' + (res.sent === 1 ? '' : 's') +
                (d.followUps.length ? '. Follow-ups scheduled.' : '.') + (res.schedulerOk ? '' : ' Scheduler is NOT running.'), 6000);
              go('#campaigns');
            }
            return false;
          });
        } }
      ]
    });
  }

  function saveSequenceFromDraft(name, originalName) {
    var d = draft;
    if (d.followUps.some(function (s) { return s.unit === 'date'; })) {
      return Promise.reject(new Error('Sequences can’t include “on a date” follow-ups — switch those to a wait first.'));
    }
    var problem = stepProblem(d.followUps);
    if (problem) return Promise.reject(new Error(problem));
    return call('studioSaveSequence', {
      name: name, originalName: originalName || '', subject: d.subject, firstMessage: d.body, steps: d.followUps
    }).then(function (seqs) { B.sequences = seqs; return seqs; });
  }

  function askSequenceName(cb) {
    modal({
      title: 'Save as a sequence',
      html: '<p style="margin-top:0">Saves your subject, first email and ' + draft.followUps.length + ' follow-up(s). ' +
        'Reuse it in the Studio or start it on any Gmail thread from the sidebar.</p>' +
        '<div class="field"><label>Name</label><input id="seqName" placeholder="e.g. Cold outreach — 3 bumps"></div>',
      actions: [
        { label: 'Cancel', cls: 'ghost' },
        { label: 'Save', cls: 'primary', onClick: function (el) {
          var name = $('#seqName', el).value.trim();
          if (!name) { toast('Give it a name.'); return true; }
          var exists = B.sequences.some(function (s) { return s.name === name; });
          if (exists && !window.__overwriteOk) { window.__overwriteOk = true; toast('“' + name + '” exists — click Save again to replace it.'); return true; }
          window.__overwriteOk = false;
          return saveSequenceFromDraft(name, '').then(function () { cb && cb(name); return false; });
        } }
      ]
    });
  }

  var menuEl = null;
  function closeMenus() { if (menuEl && menuEl.parentNode) menuEl.parentNode.removeChild(menuEl); menuEl = null; }
  var lastField = null;
  function varsMenu(btn, i) {
    closeMenus();
    var r = btn.getBoundingClientRect();
    menuEl = document.createElement('div');
    menuEl.className = 'menu';
    menuEl.style.top = (window.scrollY + r.bottom + 4) + 'px';
    menuEl.style.left = (window.scrollX + r.left) + 'px';
    menuEl.innerHTML = [['{firstName}', 'Recipient’s first name (or “there”)'], ['{senderFirstName}', 'Your first name']].map(function (v) {
      return '<button data-var="' + v[0] + '" data-i="' + i + '">' + v[0] + '<small>' + v[1] + '</small></button>';
    }).join('');
    document.body.appendChild(menuEl);
  }
  function insertVar(token, i) {
    var target = (lastField && document.body.contains(lastField)) ? lastField
      : (i < 0 ? $('textarea[data-k="body"]') : $('textarea[data-fk="message"][data-i="' + i + '"]'));
    if (!target) return;
    var s = target.selectionStart != null ? target.selectionStart : target.value.length;
    var e = target.selectionEnd != null ? target.selectionEnd : s;
    target.value = target.value.slice(0, s) + token + target.value.slice(e);
    target.focus();
    target.setSelectionRange(s + token.length, s + token.length);
    target.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // ───── Settings page ─────
  function pageSettings() {
    var h = B.health;
    $('#page').innerHTML = '<div class="page-head"><h1>Settings</h1></div>' + healthBanner() +
      '<div class="settings"><div class="card"><h3>You</h3>' +
      '<div class="field"><label>Display name (the From: line)</label><input id="sName" value="' + esc(B.me.displayName) + '" placeholder="Blank = your Gmail name"></div>' +
      '<div class="field"><label>First name for {senderFirstName}</label><input id="sFirst" value="' + esc(B.me.firstName) + '"></div>' +
      '<div class="field"><label>Signature (added to every email)</label><textarea id="sSig" rows="5" placeholder="Leave blank for none">' + esc(B.signature) + '</textarea></div>' +
      '<div class="field"><label>Time zone</label><select id="sTz">' + B.tzChoices.map(function (t) {
        return '<option value="' + esc(t.value) + '"' + (t.value === B.tz ? ' selected' : '') + '>' + esc(t.label) + '</option>'; }).join('') + '</select></div>' +
      '<button class="btn primary" data-act="save-settings">Save</button></div>' +
      '<div class="card"><h3>Scheduler</h3>' +
      '<div class="kv"><span>Status</span><span style="color:' + (h.running ? 'var(--ok)' : 'var(--bad)') + '">' + (h.running ? 'Running' : 'Not running') + '</span></div>' +
      '<div class="kv"><span>Checks every</span><span>' + h.interval + ' min</span></div>' +
      '<div class="kv"><span>Sending as</span><span>' + esc(h.account || 'unknown') + '</span></div>' +
      '<div class="kv"><span>Last check</span><span>' + (h.lastRunAgo ? esc(h.lastRunAgo) + ' ago · sent ' + h.lastRunSent : 'not yet') + '</span></div>' +
      (h.lastRunErrors || []).map(function (e) { return '<div class="hint" style="color:var(--bad)">' + esc(e) + '</div>'; }).join('') +
      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" data-act="fix">' + (h.running ? 'Re-check' : 'Fix scheduler') + '</button>' +
      '<button class="btn sm" data-act="run-now">Send due now</button></div></div></div>' + teamHtml();
  }

  // Owner only: who on the team has set the tool up, and is their robot running.
  function teamHtml() {
    if (!B.team) return '';
    function cell(v) { return v ? '<span class="pill ok">' + esc(v) + '</span>' : '<span class="pill gray">Not yet</span>'; }
    return '<div class="card" style="margin-top:24px"><div style="display:flex;align-items:center;padding:16px 16px 4px"><h3 style="margin:0;font-size:16px">Team</h3>' +
      '<button class="btn ghost sm" data-act="refresh-team" style="margin-left:auto">Refresh</button></div>' +
      '<p class="hint" style="padding:0 16px">Everyone who has opened the tool. Status only — you never see their emails.</p>' +
      (B.team.length
        ? '<table><thead><tr><th>Person</th><th>Studio opened</th><th>Gmail sidebar</th><th>Robot</th><th>Last check</th></tr></thead><tbody>' +
          B.team.map(function (m) {
            return '<tr><td><div>' + esc(m.name || m.email) + '</div><div class="sub">' + esc(m.email) + '</div></td>' +
              '<td>' + cell(m.studio) + '</td><td>' + cell(m.sidebar) + '</td>' +
              '<td>' + (m.running ? '<span class="pill ok">Running</span>' : '<span class="pill warn">Not running</span>') + '</td>' +
              '<td>' + (m.lastRun ? esc(m.lastRun) + ' · sent ' + m.lastRunSent : '<span class="sub">no check yet</span>') +
              (m.lastRunError ? '<div class="sub" style="color:var(--bad)">' + esc(m.lastRunError) + '</div>' : '') + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<p style="padding:0 16px 16px">Nobody yet.</p>') + '</div>';
  }

  // ───── Events ─────
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!draft) return;
    var k = t.getAttribute('data-k'), fk = t.getAttribute('data-fk');
    if (k) { draft[k] = t.value; }
    else if (fk) {
      var i = +t.getAttribute('data-i');
      draft.followUps[i][fk] = fk === 'amount' ? (parseInt(t.value, 10) || 0) : t.value;
    } else return;
    if (t.tagName === 'TEXTAREA') autosize(t);
    if (k === 'subject' || fk) refreshSummary();
    persistDraft();
    var sv = $('#saving'); if (sv && draft.mode === 'campaign') sv.textContent = 'Draft saved on this device';
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'seqPick' && t.value !== '') {
      var v = t.value, seq;
      t.value = '';
      if (v.indexOf('p:') === 0) {
        PRESETS.forEach(function (p) { if ('p:' + p[0] === v) seq = { name: p[0] + ' days', steps: presetSteps(p[1]) }; });
      } else seq = B.sequences[+v];
      if (seq) applySequence(seq);
      return;
    }
    if (t.getAttribute('data-fk') || t.getAttribute('data-k')) t.dispatchEvent(new Event('input', { bubbles: true }));
    if (t.getAttribute('data-fk') === 'unit') {
      var st = draft.followUps[+t.getAttribute('data-i')];
      if (st.unit === 'date' && !st.sendAtLocal) st.sendAtLocal = tomorrowNine();
      if (st.unit !== 'date' && !(st.amount > 0)) st.amount = 3;
      persistDraft(); drawCompose();
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'tsearch') { e.preventDefault(); threadQuery = $('#tq').value.trim(); loadThreads(); $('#tlist').innerHTML = '<div class="loading" style="height:160px"><div class="spin"></div>Searching…</div>'; }
  });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t.matches && t.matches('textarea.body, .row input[data-k="subject"]')) lastField = t;
  });

  document.addEventListener('click', function (e) {
    // Apps Script serves the page in a sandboxed iframe with <base target="_top">,
    // so a plain href="#x" would navigate Google's outer page instead of ours.
    var link = e.target.closest('a[href^="#"]');
    if (link) {
      e.preventDefault();
      go(link.getAttribute('href'));
      return;
    }
    var row = e.target.closest('[data-thread]');
    if (row) { go('#thread/' + row.getAttribute('data-thread')); return; }
    var v = e.target.closest('[data-var]');
    if (v) { insertVar(v.getAttribute('data-var'), +v.getAttribute('data-i')); closeMenus(); return; }
    if (menuEl && !e.target.closest('.menu') && !e.target.closest('[data-act="vars"]')) closeMenus();

    var a = e.target.closest('[data-act]');
    if (!a) return;
    var act = a.getAttribute('data-act');
    var i = +a.getAttribute('data-i');

    if (act === 'add-fu') {
      draft.followUps.push(newStep(draft.followUps[draft.followUps.length - 1]));
      persistDraft(); drawCompose();
      var last = $all('.fu-card'); if (last.length) { last[last.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); $('textarea', last[last.length - 1]).focus(); }
    } else if (act === 'rm-fu') {
      draft.followUps.splice(i, 1); persistDraft(); drawCompose();
    } else if (act === 'toggle-cc') {
      var fu = draft.followUps[i];
      fu.showCc = !(fu.showCc || fu.cc || fu.bcc);
      if (!fu.showCc) { fu.cc = ''; fu.bcc = ''; }
      persistDraft(); drawCompose();
    } else if (act === 'schedule') {
      if (!draft.followUps.length) return toast('Add a follow-up or pick a sequence first.');
      var prob = stepProblem(draft.followUps);
      if (prob) return toast(prob);
      a.disabled = true; a.textContent = 'Scheduling…';
      call('studioScheduleOnThread', {
        threadId: draft.threadId, followUps: stepsPayload(draft.followUps), recipients: draft.recipients,
        cc: draft.cc, bcc: draft.bcc, tz: draft.tz, campaignName: draft.campaignName
      }).then(function (res) {
        B.campaigns = res.campaigns;
        var n = draft.followUps.length;
        draft.thread = res.thread; draft.followUps = [];
        drawCompose();
        toast('Scheduled ' + n + ' follow-up' + (n === 1 ? '' : 's') + '.' + (res.schedulerOk ? '' : ' Scheduler is NOT running — fix it in Settings.'), 6000);
      }).catch(function (err) { a.disabled = false; a.textContent = 'Schedule follow-ups'; toast(err.message, 7000); });
    } else if (act === 'rm-q') {
      a.disabled = true;
      call('studioRemoveStep', draft.threadId, i).then(function (res) {
        B.campaigns = res.campaigns; draft.thread = res.thread; drawCompose(); toast('Removed.');
      }).catch(function (err) { a.disabled = false; toast(err.message, 6000); });
    } else if (act === 'cancel-thread') {
      modal({ title: 'Cancel all follow-ups on this email?', html: '<p style="margin-top:0">Nothing else will be sent on this thread.</p>', actions: [
        { label: 'Keep', cls: 'ghost' },
        { label: 'Cancel all', cls: 'primary', onClick: function () {
          return call('studioCancelThread', draft.threadId).then(function (res) {
            B.campaigns = res.campaigns; draft.thread = res.thread; drawCompose(); toast('Cancelled.'); return false;
          });
        } }
      ] });
    } else if (act === 'vars') {
      varsMenu(a, i);
    } else if (act === 'recipients') {
      editRecipients();
    } else if (act === 'preview') {
      modal({ title: 'Preview', html: previewHtml() });
    } else if (act === 'send') {
      confirmSend();
    } else if (act === 'clear-draft') {
      modal({ title: 'Start over?', html: '<p style="margin-top:0">Clears recipients, subject, email and follow-ups.</p>', actions: [
        { label: 'Cancel', cls: 'ghost' },
        { label: 'Clear', cls: 'primary', onClick: function () { draft = blankDraft('campaign'); store(DRAFT_KEY, null); drawCompose(); return false; } }
      ] });
    } else if (act === 'save-as-seq') {
      if (!draft.followUps.length) return toast('Add at least one follow-up first.');
      askSequenceName(function (name) { toast('Saved sequence “' + name + '”.'); drawCompose(); });
    } else if (act === 'save-seq-page') {
      var name = (draft.name || '').trim();
      if (!name) return toast('Give the sequence a name.');
      if (name !== draft.originalName && B.sequences.some(function (s) { return s.name === name; })) return toast('A sequence called “' + name + '” already exists.');
      a.disabled = true;
      saveSequenceFromDraft(name, draft.originalName).then(function () {
        toast('Saved “' + name + '”.'); go('#sequences');
      }).catch(function (err) { a.disabled = false; toast(err.message, 6000); });
    } else if (act === 'del-seq-page' || act === 'del-seq') {
      var nm = act === 'del-seq' ? B.sequences[i].name : draft.originalName;
      modal({ title: 'Delete “' + nm + '”?', html: '<p style="margin-top:0">Campaigns already running keep their follow-ups.</p>', actions: [
        { label: 'Cancel', cls: 'ghost' },
        { label: 'Delete', cls: 'primary', onClick: function () {
          return call('studioDeleteSequence', nm).then(function (seqs) { B.sequences = seqs; toast('Deleted.'); go('#sequences'); pageSequences(); return false; });
        } }
      ] });
    } else if (act === 'use-seq') {
      var seq = B.sequences[i];
      if (!draft || draft.mode !== 'campaign') draft = load(DRAFT_KEY) || blankDraft('campaign');
      go('#new');
      setTimeout(function () { applySequence(seq); }, 0);
    } else if (act === 'cancel') {
      var id = a.getAttribute('data-id');
      modal({ title: 'Stop these follow-ups?', html: '<p style="margin-top:0">Nothing else will be sent on this thread.</p>', actions: [
        { label: 'Keep', cls: 'ghost' },
        { label: 'Stop', cls: 'primary', onClick: function () {
          return call('studioCancelCampaign', id).then(function (c) { B.campaigns = c; pageCampaigns(); toast('Stopped.'); return false; });
        } }
      ] });
    } else if (act === 'refresh') {
      a.disabled = true;
      call('studioBootstrap').then(function (b) { B = b; renderChrome(); pageCampaigns(); });
    } else if (act === 'fix') {
      a.disabled = true;
      call('studioFixScheduler').then(function (r) {
        B.health = r.health; renderChrome(); route();
        toast(r.ok ? 'Scheduler is running.' : 'Could not install: ' + r.message, 6000);
      }).catch(function (err) { a.disabled = false; toast(err.message, 6000); });
    } else if (act === 'run-now') {
      a.disabled = true; a.textContent = 'Running…';
      call('studioRunNow').then(function (r) {
        B.health = r.health; B.campaigns = r.campaigns; renderChrome(); route();
        toast(r.errors.length ? 'Sent ' + r.sent + ', failed: ' + r.errors[0] : (r.sent ? 'Sent ' + r.sent + ' follow-up(s).' : 'Nothing was due.'), 6000);
      }).catch(function (err) { toast(err.message, 6000); route(); });
    } else if (act === 'refresh-team') {
      a.disabled = true;
      call('studioBootstrap').then(function (b) { B = b; renderChrome(); pageSettings(); });
    } else if (act === 'save-settings') {
      a.disabled = true;
      call('studioSaveSettings', { displayName: $('#sName').value, firstName: $('#sFirst').value, signature: $('#sSig').value, tz: $('#sTz').value })
        .then(function (b) { B = b; renderChrome(); pageSettings(); toast('Saved.'); })
        .catch(function (err) { a.disabled = false; toast(err.message, 6000); });
    }
  });


  call('studioBootstrap').then(function (b) {
    B = b;
    renderChrome();
    route();
  }).catch(function (err) {
    $('#page').innerHTML = '<div class="card empty"><h2>Couldn’t load</h2><p>' + esc(err.message) + '</p></div>';
  });
})();
</script>
</body>
</html>
