<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Gmail's own look (Material 3 tokens as Gmail uses them), so the page reads
     as part of Gmail when the extension shows it in the main pane. */
  :root {
    --blue: #0b57d0; --blue-hover: #0a4cb8; --blue-tint: #e8f0fe; --blue-sel: #d3e3fd; --blue-line: #a8c7fa;
    --ink: #1f1f1f; --ink-2: #444746; --ink-3: #747775; --line: #e1e3e1; --line-2: #c4c7c5;
    --hover: #f2f6fc; --surface: #f8fafd; --bg: #fff;
    --ok: #146c2e; --ok-bg: #c4eed0; --run: #004a77; --run-bg: #c2e7ff; --warn: #7a4a00; --warn-bg: #ffe8b0;
    --bad: #b3261e; --bad-bg: #f9dedc; --grey-bg: #e9eef6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/20px Roboto, "Google Sans", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--blue); text-decoration: none; }
  h1, h2, h3, .gs { font-family: "Google Sans", Roboto, Arial, sans-serif; }
  /* Icons are inline SVG (Material Symbols paths, see ICONS below): the icon
     font never loaded inside Apps Script's sandboxed frame, so the page showed
     names like "send". Each icon carries an outlined and a filled path. */
  .ms { display: inline-block; flex: none; width: 1em; height: 1em; font-size: 20px; vertical-align: -0.2em;
        fill: currentColor; user-select: none; }
  .ms .f, .ms.fill .o, .nav a.on .ms .o { display: none; }
  .ms.fill .f, .nav a.on .ms .f { display: inline; }

  .shell { display: flex; height: 100vh; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: auto; }
  .page { padding: 12px 24px 40px; max-width: 1180px; }

  /* Right rail: what Mailmeteor shows in Gmail's side panel. */
  .rail { width: 264px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--bg); }
  .rail-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 12px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--blue); color: #fff; display: grid; place-items: center; }
  .logo .ms { font-size: 18px; }
  .rail-head b { font: 500 16px "Google Sans", Roboto, sans-serif; display: block; }
  .rail-head small { color: var(--ink-3); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .rail-body { flex: 1; overflow: auto; padding: 0 12px 12px; }
  .rail-new { margin: 4px 8px 12px; width: calc(100% - 16px); justify-content: center; height: 40px; }
  .nav a { display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 14px; border-radius: 18px; color: var(--ink); font-weight: 500; }
  .nav a:hover { background: var(--hover); }
  .nav a.on { background: var(--blue-sel); color: #041e49; }
  .nav a .ms { color: var(--ink-2); }
  .nav a.on .ms { color: #041e49; }
  .rail h4 { font: 500 14px "Google Sans", Roboto, sans-serif; margin: 20px 10px 6px; display: flex; align-items: center; }
  .rail h4 a { margin-left: auto; font-size: 13px; }
  .rc { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .rc:hover { background: var(--hover); }
  .rc .ms { color: var(--ink-3); font-size: 18px; }
  .rc span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-empty { color: var(--ink-3); font-size: 13px; padding: 4px 10px; }
  .health { margin: 18px 4px 4px; padding: 12px 14px; border-radius: 12px; background: var(--surface); font-size: 13px; color: var(--ink-2); }
  .health b { color: var(--ink); font-weight: 500; }
  .health .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #1e8e3e; flex: none; }
  .dot.bad { background: var(--bad); }

  /* Buttons (Gmail pills) */
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line-2);
         background: #fff; color: var(--blue); font: 500 14px "Google Sans", Roboto, sans-serif; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: var(--blue-hover); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .btn.text { border-color: transparent; padding: 0 12px; }
  .btn.danger { color: var(--bad); }
  .btn.sm { height: 30px; padding: 0 12px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .btn .ms { font-size: 18px; }
  .ibtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
  .ibtn:hover { background: rgba(68,71,70,.08); }
  .ibtn.sm { width: 30px; height: 30px; }

  /* Page header */
  .head { display: flex; align-items: center; gap: 8px; min-height: 56px; margin-bottom: 8px; flex-wrap: wrap; }
  .head h1 { font-size: 22px; font-weight: 400; margin: 0; line-height: 28px; }
  .head .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .saved { color: var(--ink-3); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; }
  .saved .ms { font-size: 16px; }
  .eyebrow { color: var(--ink-3); font-size: 11px; letter-spacing: .8px; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }

  /* Tabs (Gmail category-tab style) */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .tab { border: 0; background: transparent; padding: 10px 14px 12px; cursor: pointer; color: var(--ink-2); font: 500 14px "Google Sans", Roboto, sans-serif;
         border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
  .tab:hover { background: var(--hover); }
  .tab.on { color: var(--blue); border-bottom-color: var(--blue); }
  .tab .n { font-size: 12px; color: var(--ink-3); }
  .tab.on .n { color: var(--blue); }

  /* Tables / lists (Gmail message-list density) */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 13px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 0 12px; height: 48px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { box-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 2px rgba(60,64,67,.3); position: relative; z-index: 1; }
  td.name { max-width: 0; width: 46%; }
  td.name div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.name .s { color: var(--ink-3); font-size: 12px; line-height: 16px; }
  td.num { color: var(--ink-2); white-space: nowrap; }
  td.r, th.r { text-align: right; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 11px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .pill.active { background: var(--run-bg); color: var(--run); }
  .pill.ended, .pill.completed { background: var(--ok-bg); color: var(--ok); }
  .pill.replied { background: #e7f3d9; color: #285c0e; }
  .pill.stopped { background: var(--warn-bg); color: var(--warn); }
  .pill.missing, .pill.grey { background: var(--grey-bg); color: var(--ink-2); }

  .empty { text-align: center; padding: 64px 20px; color: var(--ink-2); }
  .empty .art { width: 72px; height: 72px; border-radius: 50%; background: var(--blue-tint); color: var(--blue); display: grid; place-items: center; margin: 0 auto 16px; }
  .empty .art .ms { font-size: 34px; }
  .empty h2 { font-size: 20px; font-weight: 400; color: var(--ink); margin: 0 0 6px; }
  .empty p { margin: 0 auto 20px; max-width: 420px; }

  .banner { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-radius: 12px; margin: 4px 0 12px; font-size: 14px; }
  .banner .ms { font-size: 20px; }
  .banner.bad { background: var(--bad-bg); color: #601410; }
  .banner.warn { background: #fef7e0; color: #5c3c00; }
  .banner .btn { margin-left: auto; }

  /* Composer — Mailmeteor's layout */
  .compose { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; align-items: start; }
  .mail { border: 1px solid var(--line); border-radius: 16px; background: #fff; overflow: hidden; }
  .fld { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 44px; }
  .fld + .fld { border-top: 1px solid #f0f2f0; }
  .fld > label { width: 64px; flex: none; color: var(--ink-3); }
  .fld > input, .fld > .val { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 10px 0; }
  .fld > .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fld input::placeholder, textarea::placeholder { color: var(--ink-3); }
  .linkbtn { border: 0; background: transparent; color: var(--blue); font-weight: 500; cursor: pointer; padding: 6px 0; }
  .linkbtn:hover { text-decoration: underline; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line-2);
          background: #fff; cursor: pointer; font-weight: 500; color: var(--blue); }
  .chip:hover { background: var(--hover); }
  .chip .ms { font-size: 16px; }
  .tools { display: flex; align-items: center; gap: 2px; padding: 4px 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap; }
  .tool { height: 32px; border: 0; background: transparent; border-radius: 16px; padding: 0 10px; cursor: pointer; color: var(--ink-2);
          display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .tool:hover { background: rgba(68,71,70,.08); color: var(--ink); }
  .tool .ms { font-size: 18px; }
  .tools .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .tools .note { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--ink-3); font-size: 12px; padding-right: 6px; }
  .body { width: 100%; border: 0; outline: 0; resize: none; padding: 16px; min-height: 280px; line-height: 22px; display: block; background: transparent; }
  .body.fu { min-height: 140px; }
  .ccrow { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 40px; border-bottom: 1px solid #f0f2f0; }
  .ccrow label { width: 64px; color: var(--ink-3); flex: none; }
  .ccrow input { flex: 1; border: 0; outline: 0; padding: 8px 0; min-width: 0; }

  .link-line { width: 2px; height: 28px; background: var(--line); margin: 0 auto; }
  .fu-card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; }
  .fu-bar { background: var(--blue-tint); padding: 8px 6px 8px 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: #041e49; font-size: 13px; }
  .fu-bar .num { width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 500; flex: none; }
  .fu-bar select, .fu-bar input { height: 30px; border: 1px solid var(--blue-line); background: #fff; border-radius: 8px; padding: 0 2px 0 6px; outline: 0; font-size: 13px; }
  .fu-bar select:focus, .fu-bar input:focus { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .fu-bar input[type=number] { width: 48px; text-align: center; padding: 0 2px; }
  .fu-bar .grow { flex: 1; }
  .add-fu { display: flex; justify-content: center; }

  .side { position: sticky; top: 8px; }
  .side h3 { font-size: 16px; font-weight: 400; margin: 6px 0 14px; }
  .side section + section { margin-top: 26px; }
  .opt { display: flex; align-items: center; gap: 10px; min-height: 36px; color: var(--ink); }
  .opt .ms { color: var(--ink-2); font-size: 20px; }
  .opt .grow { flex: 1; }
  .lock { font-size: 12px; color: var(--ok); background: var(--ok-bg); border-radius: 10px; padding: 1px 8px; font-weight: 500; }
  .field { margin: 10px 0 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .field input, .field select, .field textarea, .search input { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 12px; background: #fff; outline: 0; }
  .field input:focus, .field select:focus, .field textarea:focus, .search input:focus, .paste:focus { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 16px; }
  .optbtn { width: 100%; border: 0; background: transparent; padding: 4px 6px; margin: 2px -6px; box-sizing: content-box; border-radius: 10px; cursor: pointer; text-align: left; font: inherit; }
  .optbtn:hover { background: var(--hover); }
  .optbtn small { display: block; font-size: 12px; color: var(--ink-3); }
  .opt .offpill { font-size: 12px; color: var(--ink-2); background: var(--grey-bg); border-radius: 10px; padding: 1px 8px; font-weight: 500; }
  .ap-toggle { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; color: var(--ink); }
  .ap-toggle input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--blue); flex: none; }
  .ap-toggle small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .ap-body.dim { opacity: .45; }
  .ap-h { color: var(--ink); font-weight: 500; margin: 18px 0 2px; }
  .ap-h small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
  .ap-day { display: flex; align-items: center; gap: 8px; min-height: 40px; color: var(--ink); }
  .ap-day label { display: flex; align-items: center; gap: 10px; width: 130px; cursor: pointer; }
  .ap-day input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--blue); }
  .ap-day input[type=time] { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font: inherit; background: #fff; }
  .ap-day.off input[type=time], .ap-day.off .offtxt { visibility: hidden; }
  .ap-day .offtxt { color: var(--ink-3); font-size: 13px; }
  .ap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
  .ap-grid .field { margin: 8px 0 0; }
  .ap-sum { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--blue-tint); color: #041e49; display: flex; gap: 10px; }
  .ap-sum .ms { color: var(--blue); }
  .ap-sum.warn { background: var(--warn-bg); color: var(--warn); }
  .ap-sum.warn .ms { color: var(--warn); }
  .ap-note { font-size: 12px; color: var(--ink-3); margin-top: 10px; line-height: 17px; }
  @media (max-width: 520px) { .ap-grid { grid-template-columns: 1fr; } .ap-day label { width: 112px; } .ap-day { flex-wrap: wrap; } }
  .seq { display: flex; flex-direction: column; }
  .seq-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
  .seq-item b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seq-item small { color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; font-size: 12px; }
  .seq-item small span { display: inline-flex; gap: 3px; align-items: center; }
  .seq-item small .ms { font-size: 14px; }
  .seq-join { width: 2px; height: 10px; background: var(--line); margin-left: 22px; }
  .sidelinks { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 10px; }

  .meter { display: flex; align-items: center; gap: 12px; padding: 14px 0 0; color: var(--ink-2); font-size: 12px; }
  .meter .bar { width: 200px; height: 6px; border-radius: 3px; background: var(--grey-bg); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
  .meter .bar i.over { background: var(--bad); }

  /* Campaign report */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px; margin: 8px 0 22px; }
  .tile { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .tile small { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .tile small .ms { font-size: 18px; color: var(--blue); }
  .tile b { font: 400 26px/34px "Google Sans", Roboto, sans-serif; display: block; margin-top: 4px; }
  .tile b em { font-style: normal; font-size: 14px; color: var(--ink-3); margin-left: 6px; }
  .section-h { font: 400 16px "Google Sans", Roboto, sans-serif; margin: 6px 0 8px; display: flex; align-items: center; }
  .card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .stages { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 14px; padding: 2px 6px; }
  .stages .ms { font-size: 16px; width: 22px; text-align: center; color: var(--ink-3); }
  .stages .sent { color: var(--ok); }
  .stages .next { color: var(--blue); background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(60,64,67,.3); padding: 2px 0; }
  .stages .skipped { color: #b9bcbb; }
  .meta { display: flex; gap: 22px; color: var(--ink-2); font-size: 13px; margin: 2px 0 6px; flex-wrap: wrap; }
  .meta span b { color: var(--ink); font-weight: 500; margin-left: 4px; }

  /* Sent emails + sequences */
  .search { display: flex; gap: 8px; margin: 4px 0 12px; }
  .search input { border-radius: 24px; background: var(--grey-bg); border-color: transparent; padding: 10px 18px; }
  .search input:focus { background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .seq-card { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .seq-card:hover { box-shadow: 0 1px 3px rgba(60,64,67,.25); }
  .seq-card h3 { margin: 0; font-size: 16px; font-weight: 500; }
  .seq-card .m { color: var(--ink-2); font-size: 13px; }
  .seq-card .p { color: var(--ink-3); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
  .seq-card .b { display: flex; gap: 6px; margin-top: auto; }
  .thread-top { border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .thread-top .sj { font: 400 18px "Google Sans", Roboto, sans-serif; margin-bottom: 4px; overflow-wrap: anywhere; }
  .thread-top .mt { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
  .thread-top .sn { margin-top: 10px; color: var(--ink-2); font-size: 13px; background: var(--surface); border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; }
  .qrow { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .qrow .grow { flex: 1; min-width: 0; }
  .qrow .w { font-weight: 500; font-size: 13px; }
  .qrow .mg { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .settings { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .settings .card { padding: 20px; }
  .settings h3 { margin: 0 0 8px; font-size: 16px; font-weight: 400; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .kv:last-of-type { border-bottom: 0; }
  .kv span:first-child { color: var(--ink-2); }
  .kv span:last-child { text-align: right; word-break: break-all; }

  /* Footer line */
  .foot { border-top: 1px solid var(--line); padding: 8px 24px; display: flex; align-items: center; gap: 16px; color: var(--ink-3); font-size: 12px; }
  .foot .grow { flex: 1; }

  /* Drawer (Show preview), modal, menu, toast */
  .scrim { position: fixed; inset: 0; background: rgba(32,33,36,.4); z-index: 50; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: #fff; z-index: 51; display: flex; flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
  .drawer header { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 20px; }
  .drawer header h2 { font-size: 18px; font-weight: 400; margin: 0; flex: 1; }
  .drawer .bar2 { display: flex; align-items: center; gap: 8px; padding: 0 20px 12px; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 18px; overflow: hidden; }
  .seg button { border: 0; background: #fff; height: 32px; width: 44px; cursor: pointer; color: var(--ink-2); display: grid; place-items: center; }
  .seg button.on { background: var(--blue-sel); color: #041e49; }
  .pager { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 13px; }
  .drawer .content { flex: 1; overflow: auto; padding: 16px 20px; background: var(--surface); }
  .drawer footer { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); }
  .drawer footer .why { margin-right: auto; color: var(--ink-3); font-size: 12px; }
  .checks { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; background: #fff; border: 1px solid var(--line); }
  .checks h4 { margin: 0 0 6px; font: 500 14px "Google Sans", Roboto, sans-serif; display: flex; align-items: center; gap: 8px; }

  .checks.bad h4 { color: var(--bad); }
  .checks.warn h4 { color: #7a4a00; }

  .email .sj { font: 400 20px/28px "Google Sans", Roboto, sans-serif; margin-bottom: 12px; }
  .email .who { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 500; flex: none; }
  .email .who b { font-weight: 500; }
  .email .who small { color: var(--ink-3); display: block; font-size: 12px; }
  .email .tx { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 22px; }
  .email .tag { font-size: 12px; color: var(--blue); background: var(--blue-tint); display: inline-block; border-radius: 10px; padding: 1px 10px; margin-bottom: 10px; }
  .modal-wrap { position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; padding: 16px; }
  .modal { background: #fff; border-radius: 28px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; box-shadow: 0 8px 24px rgba(0,0,0,.25); position: relative; }
  .modal header { padding: 24px 24px 8px; font: 400 22px "Google Sans", Roboto, sans-serif; }
  .modal .content { padding: 4px 24px 8px; color: var(--ink-2); }
  .modal footer { padding: 16px 24px 20px; display: flex; justify-content: flex-end; gap: 8px; }
  .rec { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; }
  .rec-tabs { display: flex; flex-direction: column; gap: 4px; }
  .rec-tabs button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: transparent; cursor: pointer; text-align: left; font-weight: 500; color: var(--ink-2); }
  .rec-tabs button.on { background: var(--blue-sel); color: #041e49; }
  .rec-tabs button:hover:not(.on) { background: var(--hover); }
  .paste { width: 100%; min-height: 220px; border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; outline: 0; resize: vertical; line-height: 20px; }
  .rec-table { border: 1px solid var(--line); border-radius: 12px; max-height: 240px; overflow: auto; }
  .rec-table td { height: 36px; }
  .toast { position: fixed; bottom: 24px; left: 24px; background: #303030; color: #f2f2f2; padding: 14px 18px; border-radius: 4px; box-shadow: 0 3px 5px rgba(0,0,0,.3);
           z-index: 70; max-width: min(560px, calc(100% - 48px)); font-size: 14px; }
  .menu { position: absolute; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px 2px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.3); padding: 8px 0; z-index: 45; min-width: 220px; }
  .menu button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 16px; cursor: pointer; }
  .menu button:hover { background: #f1f3f4; }
  .menu button .ms { color: var(--ink-2); font-size: 18px; }
  .menu small { color: var(--ink-3); display: block; font-size: 12px; }
  .loading { display: flex; align-items: center; justify-content: center; height: 50vh; color: var(--ink-3); gap: 12px; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--blue-tint); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  .spin.sm { width: 16px; height: 16px; border-width: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

    .compose { grid-template-columns: minmax(0, 1fr); }

  @media (max-width: 1080px) {

    .hide-md { display: none; }

  }
  @media (max-width: 700px) {
    .rail { display: none; }

    .foot { padding: 8px 16px; }
    .hide-sm { display: none; }
    .rec { grid-template-columns: minmax(0, 1fr); }
    .rec-tabs { flex-direction: row; flex-wrap: wrap; }

  body.composing .mobile-nav { display: none !important; }
  .mobile-nav { display: none; gap: 4px; overflow-x: auto; padding: 8px 16px 0; }

  // ───── Autopilot (account-wide sending hours, daily cap, delay) ─────
  var AP_ORDER = [1, 2, 3, 4, 5, 6, 0];
  var AP_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var AP_DELAYS = [0, 5, 10, 15, 20, 30, 45, 60, 90, 120];
  function apDaysLabel(ap) {
    var on = AP_ORDER.filter(function (d) { return ap.days[d].on; });
    if (!on.length) return 'No sending days';
    var same = on.every(function (d) { return ap.days[d].from === ap.days[on[0]].from && ap.days[d].to === ap.days[on[0]].to; });
    var short = function (d) { return AP_DAYS[d].slice(0, 3); };
    var run = on.length > 2 && AP_ORDER.indexOf(on[on.length - 1]) - AP_ORDER.indexOf(on[0]) === on.length - 1;
    var days = on.length === 7 ? 'Every day' : run ? short(on[0]) + '–' + short(on[on.length - 1]) : on.map(short).join(', ');
    return days + (same ? ' · ' + ap.days[on[0]].from + '–' + ap.days[on[0]].to : '');
  }
  function autopilotRow() {
    var ap = B.autopilot && B.autopilot.settings;
    if (!ap) return '';
    return '<button class="opt optbtn" data-act="autopilot" title="Choose when follow-ups are sent">' + ic('auto_mode') +
      '<span class="grow">Autopilot<small>' + esc(ap.enabled ? apDaysLabel(ap) : 'Follow-ups send whenever they’re due') + '</small></span>' +
      (ap.enabled ? '<span class="lock">On</span>' : '<span class="offpill">Off</span>') + '</button>';
  }
  function apDuration(min) {
    if (min < 60) return plural(Math.max(1, Math.round(min)), 'minute');
    var h = Math.floor(min / 60), m = Math.round(min % 60);
    return plural(h, 'hour') + (m ? ' ' + plural(m, 'minute') : '');
  }
  function apMins(t) { var p = String(t).split(':'); return +p[0] * 60 + +p[1]; }
  // Plain-language estimate of how long one follow-up step takes to reach n people.
  function apSummary(ap, n, example) {
    var st = B.autopilot, every = st.interval || 5, perRun = st.maxPerRun || 25;
    var on = AP_ORDER.filter(function (d) { return ap.days[d].on; });
    if (!on.length) return { warn: true, text: 'Pick at least one sending day, or follow-ups will wait forever.' };
    // The scheduler checks every few minutes, so a wait rounds up to whole checks.
    var gap = ap.delayMinutes ? Math.ceil(ap.delayMinutes / every) * every : 0;
    var who = example ? 'For every ' + n + ' recipients' : n === 1 ? 'For your recipient' : 'With ' + n + ' recipients';
    var left = n, days = 0, cap = 0;
    while (left > 0 && days < 400) {

  }

  // Minimal CSV: quoted fields, header row with email / name / first name columns.
  function csvRecipients(text) {
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) { if (ch === '"' && text[i + 1] === '"') { f += '"'; i++; } else if (ch === '"') q = false; else f += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',' || ch === ';') { row.push(f); f = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += ch;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    if (!rows.length) return [];
    var h = rows[0].map(function (x) { return x.trim().toLowerCase(); });
    var ei = h.findIndex(function (x) { return /e-?mail/.test(x); });
    var ni = h.findIndex(function (x) { return x === 'name' || x === 'full name'; });
    var fi = h.findIndex(function (x) { return /^first ?name$/.test(x); });
    var li = h.findIndex(function (x) { return /^last ?name$/.test(x); });
    var body = ei === -1 ? rows : rows.slice(1);
    var out = [], seen = {};
    body.forEach(function (r) {
      var email = ei === -1 ? (r.join(' ').match(/[^\s<>,;"]+@[^\s<>,;"]+\.[^\s<>,;"]+/) || [''])[0] : String(r[ei] || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || seen[email.toLowerCase()]) return;
      seen[email.toLowerCase()] = true;
      var name = ni !== -1 ? r[ni] : fi !== -1 ? [r[fi], li !== -1 ? r[li] : ''].join(' ') : '';
      out.push({ email: email, name: String(name || '').replace(/[<>"]/g, '').trim() });
    });
    return out;
  }

      campaignName: d.campaignName, cc: d.cc, bcc: d.bcc, tz: d.tz

  }
  function insertVar(token, i) {
    var target = (lastField && document.body.contains(lastField)) ? lastField
      : (i < 0 ? $('textarea[data-k="body"]') : $('textarea[data-fk="message"][data-i="' + i + '"]'));
    if (!target) return;
    var s = target.selectionStart != null ? target.selectionStart : target.value.length;
    var e = target.selectionEnd != null ? target.selectionEnd : s;
    target.value = target.value.slice(0, s) + token + target.value.slice(e);
    target.focus(); target.setSelectionRange(s + token.length, s + token.length);
    target.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function seqMenu(btn) {
    var items = B.sequences.map(function (s) { return { icon: 'account_tree', label: s.name, sub: describe(s.steps), run: function () { applySequence(s); } }; })
      .concat(PRESETS.map(function (p) {
        return { icon: 'bolt', label: 'Quick: ' + p[0] + ' days', sub: '3 follow-ups with your default message', run: function () { applySequence({ name: p[0] + ' days', steps: presetSteps(p[1]) }); } };
      }));
    openMenu(btn, items);
  }

  // ───── Sequences ─────
  function pageSequences() {
    var seqs = B.sequences;
    var html = '<div class="head"><h1>Sequences</h1><div class="acts"><button class="btn primary" data-go="sequence/">' + ic('add') + 'New sequence</button></div></div>';
    if (!seqs.length) {
      html += '<div class="empty"><div class="art">' + ic('account_tree') + '</div><h2>Write your follow-ups once</h2>' +
        '<p>A sequence is a set of follow-up emails. Add it to any campaign, or start it on a sent email, in one click.</p>' +
        '<button class="btn primary" data-go="sequence/">' + ic('add') + 'Create a sequence</button></div>';
    } else {
      html += '<div class="grid">' + seqs.map(function (s, i) {
        var prev = (s.steps[0] && s.steps[0].message) || s.firstMessage || '';
        return '<div class="seq-card"><h3>' + esc(s.name) + '</h3><div class="m">' + esc(describe(s.steps)) + '</div>' +
          '<div class="p">' + esc(prev.replace(/\s+/g, ' ') || 'Uses your default follow-up message.') + '</div>' +
          '<div class="b"><button class="btn sm primary" data-act="use-seq" data-i="' + i + '">Use in a campaign</button>' +
          '<button class="btn sm" data-go="sequence/' + esc(encodeURIComponent(s.name)) + '">Edit</button>' +
          '<button class="ibtn sm" title="Delete" style="margin-left:auto" data-act="del-seq" data-i="' + i + '">' + ic('delete') + '</button></div></div>';
      }).join('') + '</div>';
    }
    $('#page').innerHTML = html;
  }

  // ───── Settings ─────
  function pageSettings() {
    var h = B.health;
    $('#page').innerHTML = '<div class="head"><h1>Settings</h1></div>' + healthBanner() +
      '<div class="settings"><div class="card"><h3>How your emails look</h3>' +
      '<div class="field"><label>Your name on the From line</label><input id="sName" value="' + esc(B.me.displayName) + '" placeholder="Blank = your Gmail name"></div>' +
      '<div class="field"><label>First name for {senderFirstName}</label><input id="sFirst" value="' + esc(B.me.firstName) + '"></div>' +
      '<div class="field"><label>Signature, added to every email</label><textarea id="sSig" rows="5" placeholder="Leave blank for none">' + esc(B.signature) + '</textarea></div>' +
      '<div class="field"><label>Time zone</label><select id="sTz">' + B.tzChoices.map(function (t) {
        return '<option value="' + esc(t.value) + '"' + (t.value === B.tz ? ' selected' : '') + '>' + esc(t.label) + '</option>'; }).join('') + '</select></div>' +
      '<button class="btn primary" data-act="save-settings">Save</button></div>' +
      '<div class="card"><h3>Sending</h3>' +
      '<div class="kv"><span>Status</span><span style="color:' + (h.running ? 'var(--ok)' : 'var(--bad)') + '">' + (h.running ? 'Running' : 'Not running') + '</span></div>' +
      '<div class="kv"><span>Checks for due follow-ups</span><span>every ' + h.interval + ' min</span></div>' +
      '<div class="kv"><span>Sending as</span><span>' + esc(h.account || 'unknown') + '</span></div>' +
      '<div class="kv"><span>Last check</span><span>' + (h.lastRunAgo ? esc(h.lastRunAgo) + ' ago, sent ' + h.lastRunSent : 'not yet') + '</span></div>' +
      (h.lastRunErrors || []).map(function (e) { return '<div class="hint" style="color:var(--bad)">' + esc(e) + '</div>'; }).join('') +
      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" data-act="fix">' + (h.running ? 'Re-check' : 'Fix it') + '</button>' +
      '<button class="btn sm" data-act="run-now">Send what’s due now</button></div></div></div>' + teamHtml();
  }
  function teamHtml() {
    if (!B.team) return '';
    function cell(v) { return v ? '<span class="pill completed">' + esc(v) + '</span>' : '<span class="pill grey">not yet</span>'; }
    return '<div class="section-h" style="margin-top:24px">Team<button class="btn sm text" data-act="refresh-team" style="margin-left:auto">Refresh</button></div>' +
      '<p class="hint" style="margin:-4px 0 8px">Everyone who has opened the tool. Status only: you never see their emails.</p>' +
      (B.team.length
        ? '<div class="card"><table><thead><tr><th>Person</th><th>Studio</th><th>Gmail sidebar</th><th>Sending</th><th>Last check</th></tr></thead><tbody>' +
          B.team.map(function (m) {
            return '<tr><td class="name"><div>' + esc(m.name || m.email) + '</div><div class="s">' + esc(m.email) + '</div></td>' +
              '<td>' + cell(m.studio) + '</td><td>' + cell(m.sidebar) + '</td>' +
              '<td>' + (m.running ? '<span class="pill active">running</span>' : '<span class="pill stopped">not running</span>') + '</td>' +
              '<td class="num">' + (m.lastRun ? esc(m.lastRun) + ' · sent ' + m.lastRunSent : '–') +
              (m.lastRunError ? '<div class="hint" style="color:var(--bad)">' + esc(m.lastRunError) + '</div>' : '') + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p>Nobody yet.</p>');
  }

  // ───── Events ─────
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!draft) return;
    var k = t.getAttribute('data-k'), fk = t.getAttribute('data-fk');
    if (k) draft[k] = t.value;
    else if (fk) {
      var i = +t.getAttribute('data-i');
      draft.followUps[i][fk] = fk === 'amount' ? (parseInt(t.value, 10) || 0) : t.value;
    } else return;
    if (t.tagName === 'TEXTAREA') autosize(t);
    if (k === 'subject' || fk) refreshSummary();
    persistDraft();
    var sv = $('#saved'); if (sv && draft.mode === 'campaign') sv.innerHTML = ic('cloud_done') + 'Draft saved';
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.getAttribute('data-fk') || t.getAttribute('data-k')) t.dispatchEvent(new Event('input', { bubbles: true }));
    if (t.getAttribute('data-fk') === 'unit') {
      var st = draft.followUps[+t.getAttribute('data-i')];
      if (st.unit === 'date' && !st.sendAtLocal) st.sendAtLocal = tomorrowNine();
      if (st.unit !== 'date' && !(st.amount > 0)) st.amount = 3;
      persistDraft(); drawCompose();
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'tsearch') {
      e.preventDefault(); threadQuery = $('#tq').value.trim();
      $('#tlist').innerHTML = '<div class="loading" style="height:160px"><div class="spin"></div>Searching…</div>'; loadThreads();
    }
  });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t.matches && t.matches('textarea.body, .fld input[data-k="subject"]')) lastField = t;
  });

  document.addEventListener('click', function (e) {
    if (menuEl && !e.target.closest('.menu') && !e.target.closest('[data-act="vars"],[data-act="more"],[data-act="fu-more"],[data-act="load-seq"]')) closeMenus();
    // Apps Script serves the page with <base target="_top">, so in-page links
    // must never reach the browser.
    var link = e.target.closest('a[href^="#"]');
    if (link) { e.preventDefault(); go(link.getAttribute('href')); return; }
    var nav = e.target.closest('[data-go]');
    if (nav && !e.target.closest('[data-act]') && !e.target.closest('a[href]')) { go('#' + nav.getAttribute('data-go')); return; }
    var tab = e.target.closest('[data-tab]');
    if (tab) { listTab = tab.getAttribute('data-tab'); pageCampaigns(); return; }

    var a = e.target.closest('[data-act]');
    if (!a || a.disabled) return;
    var act = a.getAttribute('data-act'), i = +a.getAttribute('data-i');

    if (act === 'add-fu') {
      draft.followUps.push(newStep(draft.followUps[draft.followUps.length - 1]));
      persistDraft(); drawCompose();
      var cards = $all('.fu-card'); if (cards.length) { cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); $('textarea', cards[cards.length - 1]).focus(); }
    } else if (act === 'toggle-cc') {
      var fu = draft.followUps[i];
      fu.showCc = !(fu.showCc || fu.cc || fu.bcc);
      if (!fu.showCc) { fu.cc = ''; fu.bcc = ''; }
      persistDraft(); drawCompose();
    } else if (act === 'vars') {
      openMenu(a, [['{firstName}', 'Their first name (or “there”)'], ['{senderFirstName}', 'Your first name']].map(function (v) {
        return { icon: 'data_object', label: v[0], sub: v[1], run: function () { insertVar(v[0], i); } };
      }));
    } else if (act === 'more') {
      var items = [];
      if (draft.mode === 'campaign') {
        items.push({ icon: 'group', label: 'Select recipients', run: editRecipients });
        items.push({ icon: 'group_add', label: draft.showCc || draft.cc || draft.bcc ? 'Hide Cc / Bcc' : 'Add Cc / Bcc', run: function () {
          draft.showCc = !(draft.showCc || draft.cc || draft.bcc); if (!draft.showCc) { draft.cc = ''; draft.bcc = ''; } persistDraft(); drawCompose(); } });
        items.push({ icon: 'outgoing_mail', label: 'Send me a test', run: function () { sendTest(-1); } });
      }
      items.push({ icon: 'account_tree', label: 'Use a saved sequence', run: function () { seqMenu(a); } });
      openMenu(a, items);
    } else if (act === 'fu-more') {
      var f = draft.followUps[i];
      openMenu(a, [
        { icon: 'group_add', label: (f.showCc || f.cc || f.bcc) ? 'Remove Cc / Bcc' : 'Cc / Bcc on this follow-up', run: function () {
          f.showCc = !(f.showCc || f.cc || f.bcc); if (!f.showCc) { f.cc = ''; f.bcc = ''; } persistDraft(); drawCompose(); } }
      ].concat(draft.mode === 'campaign' ? [{ icon: 'outgoing_mail', label: 'Send me a test of this follow-up', run: function () { sendTest(i); } }] : [])
       .concat([{ icon: 'delete', label: 'Remove this follow-up', run: function () { draft.followUps.splice(i, 1); persistDraft(); drawCompose(); } }]));
    } else if (act === 'load-seq') {
      seqMenu(a);
    } else if (act === 'autopilot') {
      openAutopilot();
    } else if (act === 'test') {
      sendTest(i, a);
    } else if (act === 'recipients') {
      editRecipients();
    } else if (act === 'preview') {
      openPreview();
    } else if (act === 'review') {
      var problem = draft.mode === 'thread'
        ? (!draft.followUps.length ? 'Add a follow-up or use a saved sequence first.' : stepProblem(draft.followUps))
        : stepProblem(draft.followUps);
      if (problem) return toast(problem);
      openPreview();
    } else if (act === 'rm-q') {
      a.disabled = true;
      call('studioRemoveStep', draft.threadId, i).then(function (res) {
        B.campaigns = res.campaigns; draft.thread = res.thread; drawCompose(); toast('Removed.'); refreshState().then(function () { renderRail('thread'); });
      }).catch(function (err) { a.disabled = false; toast(err.message, 6000); });
    } else if (act === 'cancel-thread') {
      confirmBox('Cancel every follow-up on this email?', 'Nothing else will be sent on this thread.', 'Cancel all', function () {
        return call('studioCancelThread', draft.threadId).then(function (res) {
          draft.thread = res.thread; return refreshState().then(function () { renderRail('thread'); drawCompose(); toast('Cancelled.'); return false; });
        });
      });
    } else if (act === 'stop-campaign') {
      confirmBox('Stop this campaign?', 'No more follow-ups will go out to anyone in “' + esc(report.name) + '”. Emails already sent stay sent.', 'Stop all', function () {
        return call('studioStopCampaign', report.id).then(function (s) { setState(s); toast('Stopped.'); route(); return false; });
      });
    } else if (act === 'stop-one') {
      var p = report.people[i];
      confirmBox('Stop follow-ups to ' + esc(p.email) + '?', 'Nothing else will be sent on their thread.', 'Stop', function () {
        return call('studioCancelCampaign', p.threadId).then(function () { return refreshState(); }).then(function () { toast('Stopped.'); route(); return false; });
      });
    } else if (act === 'clear-draft') {
      confirmBox('Start over?', 'Clears the recipients, subject, email and follow-ups.', 'Clear', function () {
        draft = blankDraft('campaign'); store(DRAFT_KEY, null); drawCompose(); return false;
      });
    } else if (act === 'save-as-seq') {
      if (!draft.followUps.length) return toast('Add at least one follow-up first.');
      askSequenceName(function (name) { toast('Saved sequence “' + name + '”.'); drawCompose(); });
    } else if (act === 'save-seq-page') {
      var name = (draft.name || '').trim();
      if (!name) return toast('Give the sequence a name.');
      if (name !== draft.originalName && B.sequences.some(function (s) { return s.name === name; })) return toast('A sequence called “' + name + '” already exists.');
      a.disabled = true;
      saveSequenceFromDraft(name, draft.originalName).then(function () { toast('Saved “' + name + '”.'); go('#sequences'); })
        .catch(function (err) { a.disabled = false; toast(err.message, 6000); });
    } else if (act === 'del-seq-page' || act === 'del-seq') {
      var nm = act === 'del-seq' ? B.sequences[i].name : draft.originalName;
      confirmBox('Delete “' + esc(nm) + '”?', 'Campaigns already running keep their follow-ups.', 'Delete', function () {
        return call('studioDeleteSequence', nm).then(function (seqs) { B.sequences = seqs; toast('Deleted.'); go('#sequences'); return false; });
      });
    } else if (act === 'use-seq') {
      var seq = B.sequences[i];
      if (!draft || draft.mode !== 'campaign') draft = load(DRAFT_KEY) || blankDraft('campaign');
      go('#new'); applySequence(seq);
    } else if (act === 'refresh') {
      a.disabled = true;
      refreshState().then(route).catch(function (err) { toast(err.message); a.disabled = false; });
    } else if (act === 'fix') {
      a.disabled = true;
      call('studioFixScheduler').then(function (r) {
        B.health = r.health; route();
        toast(r.ok ? 'Follow-ups are on.' : 'Couldn’t switch it on: ' + r.message, 7000);
      }).catch(function (err) { a.disabled = false; toast(err.message, 6000); });
    } else if (act === 'run-now') {
      a.disabled = true; a.textContent = 'Checking…';
      call('studioRunNow').then(function (r) {
        B.health = r.health; B.campaigns = r.campaigns;
        return refreshState().then(function () {
          route();
          toast(r.errors.length ? 'Sent ' + r.sent + ', failed: ' + r.errors[0] : (r.sent ? 'Sent ' + plural(r.sent, 'follow-up') + '.' : 'Nothing was due.'), 6000);
        });
      }).catch(function (err) { toast(err.message, 6000); route(); });
    } else if (act === 'refresh-team') {
      a.disabled = true;
      call('studioBootstrap').then(function (b) { B = b; route(); });
    } else if (act === 'save-settings') {
      a.disabled = true;
      call('studioSaveSettings', { displayName: $('#sName').value, firstName: $('#sFirst').value, signature: $('#sSig').value, tz: $('#sTz').value })
        .then(function (b) { B = b; route(); toast('Saved.'); })
        .catch(function (err) { a.disabled = false; toast(err.message, 6000); });
    }
  });

  // ?view=new opens the composer straight away (the extension's "New campaign").
  function start(view) {
    call('studioBootstrap').then(function (b) {
      B = b;
      current = /^(new|threads|sequences|settings|campaigns)$/.test(view || '') ? view : 'campaigns';
      route();
    }).catch(function (err) {
      $('#page').innerHTML = '<div class="empty"><h2>Couldn’t load</h2><p>' + esc(err.message) + '</p></div>';
    });
  }
  try { google.script.url.getLocation(function (loc) { start((loc && loc.parameter && loc.parameter.view) || ''); }); }
  catch (e) { start(''); }
})();
</script>
</body>
</html>
